name: Aksam Raporu Cron

on:
  schedule:
    - cron: '35 15,16 * * 1-5'
  workflow_dispatch:

jobs:
  aksam-raporu:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aksam raporu gonderimi
        run: |
          body=$(curl -s -w "\n%{http_code}" \
            -X GET "https://www.parakonusur.com/api/cron/aksam-raporu" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 90)
          status=$(echo "$body" | tail -n1)
          json=$(echo "$body" | sed '$d')
          echo "HTTP Status: $status"
          echo "Yanit: $json"
          if [ "$status" != "200" ]; then
            echo "HTTP hatasi: $status"
            exit 1
          fi
          if echo "$json" | grep -qE '"hata":\s*[1-9]'; then
            echo "Cron yaniti hata bildirdi (hata sayaci > 0)"
            exit 1
          fi
