name: Alarm Cron Job

on:
  schedule:
    - cron: '4-49/15 * * * *'
  workflow_dispatch:

jobs:
  check-alarms:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Alarm kontrolu
        run: |
          body=$(curl -s -w "\n%{http_code}" \
            -X GET "https://www.parakonusur.com/api/cron/alarmlar" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 90)
          status=$(echo "$body" | tail -n1)
          json=$(echo "$body" | sed '$d')
          echo "HTTP Status: $status"
          echo "Yanit: $json"
          if [ "$status" != "200" ]; then
            echo "HTTP hatasi: $status"
            exit 1
          fi
          if echo "$json" | grep -qE '"hata":\s*[1-9]'; then
            echo "Cron yaniti hata bildirdi (hata sayaci > 0)"
            exit 1
          fi
